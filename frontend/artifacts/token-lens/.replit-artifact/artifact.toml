kind = "web"
previewPath = "/"
title = "Token Lens"
description = "A polished developer tool for sending text to a configurable tokenization API and inspecting the returned token boundaries, count, and indices without changing the backend response."
version = "1.0.0"
id = "artifacts/token-lens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20238

[services.development]
run = "pnpm --filter @workspace/token-lens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/token-lens", "run", "build" ]
serve = "static"
publicDir = "artifacts/token-lens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20238"
BASE_PATH = "/"
